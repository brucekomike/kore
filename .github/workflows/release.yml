name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    name: Linux AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake g++ qt6-base-dev qt6-base-dev-tools libfuse2
      - name: Build
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release && cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package AppImage
        run: |
          cmake --install build --prefix AppDir/usr
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          export QMAKE=/usr/lib/qt6/bin/qmake6
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/kore.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/kore.svg \
            --plugin qt \
            --output appimage
          mv ./*-x86_64.AppImage kore-linux-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: kore-linux
          path: kore-linux-x86_64.AppImage

  macos:
    name: macOS package
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        run: brew install qt svg2png
      - name: Generate macOS icon
        run: ./packaging/generate-icns.sh
      - name: Build
        run: cmake -B build -S . -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" && cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Bundle Qt frameworks
        run: "$(brew --prefix qt)/bin/macdeployqt build/kore.app"
      - name: Package
        run: |
          "$(brew --prefix qt)/bin/macdeployqt" build/kore.app -dmg
          mv build/kore.dmg kore-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: kore-macos
          path: kore-macos.dmg

  windows:
    name: Windows single exe
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install 7-Zip
        shell: pwsh
        run: choco install 7zip --yes --no-progress
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: win64_msvc2022_64
      - name: Build
        shell: pwsh
        run: cmake -B build -S .; cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install bundled application
        shell: pwsh
        run: |
          $stagingDir = Join-Path $PWD "staging"
          cmake --install build --prefix $stagingDir --config Release
      - name: Package application
        shell: pwsh
        run: |
          $stagingDir = Join-Path $PWD "staging"
          $sevenZip = Join-Path $env:ProgramFiles "7-Zip\7z.exe"
          Push-Location $stagingDir
          & $sevenZip a -t7z -mx=9 -sfx (Join-Path $PWD "..\kore-windows.exe") .\*
          Pop-Location
      - uses: actions/upload-artifact@v4
        with:
          name: kore-windows
          path: kore-windows.exe

  publish:
    name: Publish release
    runs-on: ubuntu-24.04
    needs: [linux, macos, windows]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: kore-*
          merge-multiple: true
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
