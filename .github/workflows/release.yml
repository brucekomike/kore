name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    name: Linux AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake g++ qt6-base-dev qt6-base-dev-tools libfuse2
      - name: Build
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release && cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package AppImage
        run: |
          cmake --install build --prefix AppDir/usr
          wget -q -O linuxdeploy-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          wget -q -O linuxdeploy-plugin-qt-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          export QMAKE=/usr/lib/qt6/bin/qmake6
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable AppDir/usr/bin/kore \
            --desktop-file AppDir/usr/share/applications/kore.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/kore.svg \
            --plugin qt \
            --output appimage
          app_image="$(find . -maxdepth 1 -type f -name '*-x86_64.AppImage' ! -name 'linuxdeploy*.AppImage' | head -n 1)"
          test -n "$app_image"
          mv "$app_image" kore-linux-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: kore-linux
          path: kore-linux-x86_64.AppImage

  macos:
    name: macOS package
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        run: brew install qt svg2png
      - name: Generate macOS icon
        run: ./packaging/generate-icns.sh
      - name: Build
        run: cmake -B build -S . -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" && cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Bundle Qt frameworks
        run: "$(brew --prefix qt)/bin/macdeployqt build/kore.app"
      - name: Package
        run: |
          "$(brew --prefix qt)/bin/macdeployqt" build/kore.app -dmg
          mv build/kore.dmg kore-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: kore-macos
          path: kore-macos.dmg

  windows:
    name: Windows single exe
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: win64_msvc2022_64
      - name: Build
        shell: pwsh
        run: cmake -B build -S .; cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install bundled application
        shell: pwsh
        run: |
          $stagingDir = Join-Path $PWD "staging"
          cmake --install build --prefix $stagingDir --config Release
      - name: Package application
        shell: pwsh
        run: |
          $stagingDir = Join-Path $PWD "staging"
          $outputDir = $PWD.Path
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=${{ github.ref_name }}" "/DSourceDir=$stagingDir" "/DOutputDir=$outputDir" "packaging\kore-installer.iss"
          $installerPath = Join-Path $outputDir "kore-windows.exe"
          if (-not (Test-Path $installerPath)) {
            throw "Expected installer was not generated: $installerPath"
          }
      - name: Package portable archive
        shell: pwsh
        run: |
          $stagingDir = Join-Path $PWD "staging"
          $portablePath = Join-Path $PWD "kore-windows-portable.zip"
          if (Test-Path $portablePath) {
            Remove-Item $portablePath -Force
          }
          $archiveItems = Get-ChildItem -Path $stagingDir -Force
          Compress-Archive -Path $archiveItems.FullName -DestinationPath $portablePath
          if (-not (Test-Path $portablePath)) {
            throw "Expected portable archive was not generated: $portablePath"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: kore-windows
          path: |
            kore-windows.exe
            kore-windows-portable.zip

  publish:
    name: Publish release
    runs-on: ubuntu-24.04
    needs: [linux, macos, windows]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: kore-*
          merge-multiple: true
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
